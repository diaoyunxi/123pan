[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "B324",   # MD5 used for non-security hashing (S3 ETag)
    "S101",   # assert usage
    "PLR2004", # magic values
    "S603",   # subprocess intentional
    "S607",   # partial paths
]

[tool.ruff.lint.isort]
known-first-party = ["pan123_core", "pan123_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
